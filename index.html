<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon & Emily — 12.09.2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <h1 class="header-title">Leon & Emily</h1>
            <div class="header-timer-container">
                <div class="timer-box"><p id="days">00</p><p>days</p></div>
                <div class="timer-box"><p id="hours">00</p><p>hours</p></div>
                <div class="timer-box"><p id="minutes">00</p><p>minutes</p></div>
                <div class="timer-box"><p id="seconds">00</p><p>second</p></div>
                <div class="timer-box"><p id="ms">00</p><p>ms</p></div>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Секция Hero с исправленным, чистым YouTube-плеером -->
        <section class="hero">
            <div class="hero-container">
                <div class="hero-pass">
                    <h2 class="neon-title">🎬 Наша история</h2>
                    <div class="video-responsive">
                        <!-- Строго embed-ссылка без лишних параметров, обходящая SameOrigin -->
                        <iframe 
                            src="https://youtube.com" 
                            title="YouTube video player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

        <!-- Секция Капсулы времени -->
        <section class="program">
            <div class="glass-container">
                <div class="glass-card">
                    <h2 class="neon-title">🔒 Капсула времени</h2>
                    <p class="capsule-desc">
                        Оставьте теплое пожелание или предсказание для молодоженов. 
                        Мы запечатаем ваше послание, и Леон вместе с Эмили откроют его ровно через год — на первую годовщину свадьбы!
                    </p>
                    
                    <form id="capsule-form">
                        <div class="input-group">
                            <input type="text" id="guest-name" placeholder="Ваше Имя и Фамилия" required class="glass-input">
                        </div>

                        <div class="input-group">
                            <textarea id="guest-wish" placeholder="Ваше пророчество или пожелание в будущее..." required class="glass-input textarea-fixed" rows="4"></textarea>
                        </div>

                        <button type="submit" id="submit-btn" class="glass-button">Запечатать в будущее</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
